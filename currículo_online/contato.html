<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .navbar {
            background-color: rgb(43, 48, 54) !important;
        }

        .form-container {
            max-width: 700px;
            background: rgb(43, 48, 54);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .form-label {
            font-weight: 700;
            color: #ffffff;
            font-size: 0.9rem;
        }

        .form-control,
        .form-select {
            background-color: #2b2d31;
            border: 1px solid #4b4d52;
            color: white;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #2b2d31;
            color: white;
            border-color: #4461f2;
            box-shadow: 0 0 0 0.2rem rgba(68, 97, 242, 0.25);
        }

        .btn-enviar {
            background-color: #4461f2;
            border: none;
            padding: 10px 30px;
            border-radius: 30px;
            font-weight: 600;
        }

        .btn-enviar:hover {
            background-color: #3550d8;
        }

        h2 {
            color: white;
            font-weight: 700;
        }
    </style>
</head>

<body class="bg-dark text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary mb-5">
        <div class="container">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="portifolio.html">Portfólio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contato.html">Contato</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- Formulário -->
    <main class="container d-flex justify-content-center">
        <div class="form-container w-100">

            <h2 class="text-center mb-4">Formulário para Contato</h2>

            <form>

                <div class="row g-3 mb-3">

                    <div class="col-md-6">
                        <label class="form-label">Primeiro Nome:</label>
                        <input type="text" class="form-control" id="firstName">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Último Nome:</label>
                        <input type="text" class="form-control" id="lastName">
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Diga pontos interessantes deste perfil:</label>
                    <textarea class="form-control" id="points" rows="4"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Qual habilidade mais te interessa?</label>

                    <select class="form-select" id="skill">
                        <option selected disabled>Escolha...</option>
                        <option>Programação</option>
                        <option>Artes</option>
                        <option>Atuação</option>
                        <option>Escrita</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Adicione um comentário:</label>
                    <textarea class="form-control" id="comment" rows="3"></textarea>
                </div>

                <div class="text-center">
                    <button type="button" class="btn btn-primary btn-enviar" onclick="enviarEmail()">
                        <i class="bi bi-send-fill me-2"></i>
                        Enviar
                    </button>
                </div>

            </form>

        </div>
    </main>

    <script>
        function enviarEmail() {
            const nome = document.getElementById('firstName').value;
            const sobrenome = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const pontos = document.getElementById('points').value;
            const skill = document.getElementById('skill').value;
            const comentario = document.getElementById('comment').value;

            if (!nome || !sobrenome || !email) {
                alert("Preencha pelo menos nome, sobrenome e email.");
                return;
            }

            const emailDestino = "vimavamima@gmail.com";

            const assunto = encodeURIComponent(`Contato de ${nome} ${sobrenome}`);
            const corpoEmail = encodeURIComponent(
                `Nome: ${nome} ${sobrenome}\n` +
                `Email: ${email}\n` +
                `Skill: ${skill}\n\n` +
                `Pontos:\n${pontos}\n\n` +
                `Comentário:\n${comentario}`
            );

            const urlGmail =
                `https://mail.google.com/mail/?view=cm&fs=1&to=${emailDestino}&su=${assunto}&body=${corpoEmail}`;

            window.open(urlGmail, '_blank');
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
